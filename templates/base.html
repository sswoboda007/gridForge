<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ appName }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="site-header">
            <a class="brand" href="{{ url_for('public.landingPage') }}">
                <span class="brand-mark">GF</span>
                <span>{{ appName }}</span>
            </a>
            <nav class="site-nav" aria-label="Primary navigation">
                <a href="{{ url_for('public.landingPage') }}">Overview</a>
                <a href="{{ url_for('public.startPage') }}">Start Blueprint</a>
                <a href="{{ url_for('admin.projectList') }}">Admin Projects</a>
                <a href="{{ url_for('health.healthCheck') }}">Health</a>
                {% if isLoggedIn %}
                    <span class="auth-status">{{ currentUserEmail }} · {{ currentUserRoles | join(', ') }}</span>
                    <form class="inline-form" action="{{ url_for('auth.logout') }}" method="post">
                        <button type="submit">Log out</button>
                    </form>
                {% else %}
                    <a href="{{ url_for('auth.loginPage') }}">Demo Login</a>
                {% endif %}
            </nav>
        </header>
        <main class="site-main">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            <span>{{ companyName }}</span>
            <span>Cloud-first workflow operating systems.</span>
        </footer>
    </div>
</body>
</html>
